name: Tabulate UFL Archive Weeks

on:
  # 1. Allows you to trigger this workflow manually on-demand from the UI
  workflow_dispatch:

  # 2. Runs on a schedule every Tuesday at 9:00 AM UTC (5:00 AM EST)
  schedule:
    - cron: '0 9 * * 2'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your repository files
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Fetches all history so git can commit changes back cleanly
        fetch-depth: 0 

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/checkout@v4
      uses: actions/setup-python@v5
      with:
        python-key: '3.11'

    # Step 3: Install BeautifulSoup4 dependency safely
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4

    # Step 4: Execute your compilation script
    - name: Run Archive Sync Script
      run: python update_archive.py  # <-- Make sure this matches your script file name!

    # Step 5: Check for modifications and automatically push them to your main branch
    - name: Commit and Push Updated Archive
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Check if the 26_UFLArch.htm file was modified by the script
        git add pages/26_UFLArch.htm
        
        # Commit and push only if there are actually changes to write
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-tabulate unparsed weeks in archive [skip ci]"
          git push origin main
        else
          echo "No new weeks discovered. Table is fully up to date."
        fi
