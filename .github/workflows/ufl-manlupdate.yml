name: Manual UFL Scores Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      # FIXED: Points to the accurate filename UFL_update.js
      - name: Execute UFL Updater Script
        run: node UFL_updater.js

      # FIXED: Added UFLWTmp to the git tracking stage to catch the active root file
      - name: Commit and Push Updated HTML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          echo "=== git status before ==="
          git status --porcelain
          echo "=== git diff names before ==="
          git --no-pager diff --name-only || true
          # Stage all changes (root and pages)
          git add -A
          echo "=== git status staged ==="
          git status --porcelain
          echo "=== git diff staged names ==="
          git --no-pager diff --staged --name-only || true
          # Commit and push if there are staged changes
          git diff-index --quiet HEAD || (git commit -m "Automated update of live UFL scores" && git push origin HEAD:main)
