name: Manual UFL Scores Update

on:
  workflow_dispatch: # This creates the "Run workflow" button on GitHub for on-demand triggers

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Project Dependencies
      run: npm install

    - name: Execute UFL Updater Script
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: node UFL_updater.js

    - name: Commit and Push Updated HTML
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Tracks the template files in the root folder and your pages folder
        git add *.htm pages/*.htm
        
        git diff-index --quiet HEAD || (git commit -m "Automated update of live UFL scores" && git push)
