name: Manual UFL Scores Update

on:
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Execute UFL Updater Script
      run: node UFL_updater.js

    - name: Commit and Push Updated HTML
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        git add *.htm pages/*.htm
        git diff-index --quiet HEAD || (git commit -m "Automated update of live UFL scores" && git push)
