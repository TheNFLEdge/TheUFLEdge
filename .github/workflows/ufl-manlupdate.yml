name: Manual UFL Scores Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      # FIXED: Points to the accurate filename UFL_update.js
      - name: Execute UFL Updater Script
        run: node UFL_updater.js

      # FIXED: Added UFLWTmp to the git tracking stage to catch the active root file
      - name: Commit and Push Updated HTML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *.htm pages/*.htm UFLWTmp
          git diff-index --quiet HEAD || (git commit -m "Automated update of live UFL scores" && git push)
