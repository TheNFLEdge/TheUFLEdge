name: Weekly UFL Data Sync

on:
  schedule:
    # Runs at 10:00 AM UTC (6 AM ET) every Tuesday
    - cron: '0 10 * * 2'
  workflow_dispatch: # Allows you to run it manually to test it right now

jobs:
  sync_file:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4

    - name: Fetch file from source repository
      run: |
        curl -L -H "Accept: application/vnd.github.v3.raw" \
        -o UFL/UFLWTmp.htm \
        https://githubusercontent.com

    # --- NODE.JS ENVIRONMENT SETUP ---
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node.js Dependencies
      run: npm install

    # --- RUN THE UPDATER SCRIPT ---
    - name: Run UFL Scores and Projections Updater
      env:
        # Securely maps your GitHub Secret to your script's process.env
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: node UFL_updater.js

    # --- COMMIT AND PUSH ALL CHANGES ---
    - name: Commit and push if changed
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Track the template and the files generated in your pages subfolder
        git add UFL/UFLWTmp.htm
        git add pages/*.htm
        
        if git diff --staged --quiet; then
          echo "No changes detected."
        else
          git commit -m "Automated Tuesday sync, score injection, and week finalization"
          git push
        fi

