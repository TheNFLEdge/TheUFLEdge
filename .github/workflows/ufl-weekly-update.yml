name: UFL Weekly Update

on:
  schedule:
    - cron: '30 3 * * 2' # Tuesday at 3:30 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # PHASE 1: FINALIZE CURRENT WEEK SCORES
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Final Score Injection
        run: npm run update:final

      # ============================================
      # PHASE 2: ARCHIVE COMPLETED WEEK
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Tabulate and Archive Completed Week
        run: npm run archive

      # ============================================
      # PHASE 3: GENERATE NEXT WEEK'S PROJECTIONS
      # ============================================
      - name: Generate ESPN Data for Next Week
        run: npm run generate:espn

      - name: Generate Score Projections for Next Week
        run: npm run generate:projections

      # ============================================
      # PHASE 4: COMMIT & PUSH ALL UPDATES
      # ============================================
      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Weekly UFL Turnover: finalized scores, archived week, generated projections'
          commit_options: '--no-verify'
          file_pattern: 'pages/*.htm *.htm ufl_data_handoff.json *.json'
          branch: main
